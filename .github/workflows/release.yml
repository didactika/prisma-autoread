name: Release

# A manual version-tag push runs the full quality gate. The normal path is dispatched
# by ci.yml after that same gate has already passed, so it does not repeat the tests.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual-tag quality gate — the automatic path already passed this matrix in ci.yml.
  ci:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/ci.yml

  # 2) Pre-flight checks that are specific to publishing.
  validate:
    name: validate release
    if: >-
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      already_published: ${{ steps.published.outputs.exists }}
      should_publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read package metadata
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publishing requires a version tag
        if: steps.mode.outputs.publish == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*) ;;
            *)
              echo "::error::Publishing must run from a version tag, got $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Version must be valid semver
        run: |
          echo "${{ steps.pkg.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Invalid semver: ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: CHANGELOG must mention this version
        run: |
          grep -q "\[${{ steps.pkg.outputs.version }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: Version must not already exist on npm
        id: published
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::error::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published"
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      - name: Built output must exist
        run: |
          for f in dist/index.js dist/index.mjs dist/index.d.ts; do
            [ -s "$f" ] || { echo "::error::Missing build artifact: $f"; exit 1; }
          done

      - name: Package must be importable (CJS and ESM)
        run: |
          node -e "const m=require('./dist/index.js'); if(typeof m.createAutoRead!=='function') throw new Error('CJS export missing'); console.log('CJS ok');"
          node --input-type=module -e "import('./dist/index.mjs').then(m=>{if(typeof m.createAutoRead!=='function')throw new Error('ESM export missing');console.log('ESM ok')})"

      - name: Inspect the tarball (no source, no docs)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [p]=require('/tmp/pack.json');
            const files=p.files.map(f=>f.path);
            const leaked=files.filter(f=>/^(src|tests|docs|examples)\//.test(f)||f==='AGENTS.md');
            if(leaked.length){console.error('Unexpected files in the package:',leaked);process.exit(1);}
            if(!files.some(f=>f.startsWith('dist/'))){console.error('No dist/ in the package');process.exit(1);}
            console.log('Tarball contents ok:',files.length,'files,',p.size,'bytes');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # 3) Publish.
  publish:
    name: publish to npm
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    needs: validate
    environment: npm            # optional approval gate; configure in repo settings
    permissions:
      contents: write            # create the GitHub Release after npm succeeds
      id-token: write           # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1. Node 22 runners can still ship
      # an older npm, which signs provenance but cannot exchange GitHub's OIDC token.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      # Authentication is exclusively OIDC trusted publishing. Do not set
      # NODE_AUTH_TOKEN: npm obtains a short-lived credential from GitHub.
      - name: Publish with npm trusted publishing
        if: needs.validate.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Dry run
        if: needs.validate.outputs.should_publish == 'false'
        run: npm publish --access public --dry-run

      - name: Create GitHub Release
        if: needs.validate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION_TAG already exists"
          else
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --title "$VERSION_TAG" \
              --generate-notes
          fi

      - name: Published summary
        if: needs.validate.outputs.should_publish == 'true'
        run: |
          echo "### Published \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@didactika/prisma-autoread" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: needs.validate.outputs.should_publish == 'false'
        run: echo "### Dry run completed for \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
