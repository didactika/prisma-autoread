name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # reused by the release workflow as its quality gate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./test.db

jobs:
  # Full suite on every maintained Node LTS line.
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:e2e

  # Peer-dependency matrix: every supported Express and Prisma major.
  compat:
    name: express ${{ matrix.express }} · prisma ${{ matrix.prisma }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        express: [4, 5]
        prisma: [5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install peer versions under test
        run: npm install --no-save express@${{ matrix.express }} prisma@${{ matrix.prisma }} @prisma/client@${{ matrix.prisma }}

      # Prisma 7 removed `datasource.url` in favour of prisma.config.ts.
      - name: Adapt the fixture for Prisma 7
        if: matrix.prisma == 7
        run: |
          sed -i '/url      = env("DATABASE_URL")/d' prisma/schema.prisma
          printf "import { defineConfig } from 'prisma/config';\nexport default defineConfig({ schema: 'prisma/schema.prisma' });\n" > prisma.config.ts

      - run: npx prisma generate
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration

      # e2e needs a live datasource; Prisma 7 requires a driver adapter, which is the
      # host application's choice, so it is exercised on 5 and 6.
      - name: e2e
        if: matrix.prisma != 7
        run: npm run test:e2e

  # Single gate the release workflow can depend on.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [test, compat]
    steps:
      - run: echo "All test and compatibility jobs passed."

  # A tag pushed with GITHUB_TOKEN does not trigger another workflow automatically.
  # Create the missing version tag after CI succeeds, then explicitly dispatch the
  # release workflow on that tag.
  release:
    name: tag and start release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the version tag exists
        id: tag
        env:
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Start release workflow
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: gh workflow run release.yml --ref "$VERSION_TAG" -f dry_run=false
